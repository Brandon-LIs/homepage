name: 同步博客文章

# 三种触发方式：
#   1. 博客仓库发布新文章 → 通过 repository_dispatch 通知（见 README）
#   2. 每天定时兜底，防止漏掉通知
#   3. 手动点一下就跑
on:
  repository_dispatch:
    types: [blog-updated]
  schedule:
    # 每天 UTC 20:00（北京时间 04:00）跑一次，避开白天
    - cron: "0 20 * * *"
  workflow_dispatch:

# 同一时间只允许一个同步任务，避免两次提交打架
concurrency:
  group: sync-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          # 写完整的三段版本号最稳妥。
          # "22.12" 这类两位写法依赖 setup-node 的模糊匹配，
          # 一旦解析不到就直接失败、后续步骤全被跳过——我们已经踩过一次。
          # 22.12.0 在 node-versions 官方清单里确认存在且为 stable。
          node-version: "22.12.0"
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 抓取最新文章
        id: fetch
        # 用块标量（|）而不是行内写法：
        # YAML 不认识 shell 的引号，行内字符串里出现 ": " 会被当成键值分隔符，
        # 导致整个工作流无法解析、连启动都启动不了。块标量没有这个坑。
        run: |
          set +e
          node scripts/fetch-posts.mjs --limit 4
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            # 博客临时不可达不该让整个流程失败：
            # 已有 posts.json 保持不动，这次只是没更新。
            echo "::warning::RSS 抓取失败，本次跳过更新（沿用已有 posts.json）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- src/data/posts.json; then
            echo "文章没有变化，无需提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交并推送
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts.json
          git commit -m "chore(posts): 同步博客最新文章"
          git push

      # 如果用的是 Vercel 的 Git 集成，上面的 push 会自动触发部署，
      # 这一步会被跳过。只有配了 VERCEL_DEPLOY_HOOK 才需要它。
      - name: 触发部署钩子
        if: steps.fetch.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl -sS -X POST "$HOOK" -o /dev/null -w "deploy hook responded %{http_code}\n"
